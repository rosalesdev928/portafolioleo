<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portafolio de Leonardo Rosales, desarrollador backend especializado en APIs, bases de datos y soluciones cloud." />
    <meta name="theme-color" content="#0a0f0e" />
    <title>Leonardo Rosales | Backend Developer</title>
    <style>
      html { background: #0a0f0e; color-scheme: dark; }
      html[data-theme="light"] { background: #f6f7f2; color-scheme: light; }
    </style>
    <script>
      (function () {
        var theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var language = 'es';
        try {
          var savedTheme = localStorage.getItem('portfolio-theme');
          if (savedTheme === 'dark' || savedTheme === 'light') theme = savedTheme;
          if (localStorage.getItem('portfolio-language') === 'en') language = 'en';
        } catch (_) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = language;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0a0f0e' : '#f6f7f2');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
